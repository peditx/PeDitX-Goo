[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

# Release profile: optimised for size and speed, since the island should cost
# nothing while it is hidden.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
